<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d5b">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مدرب الافتتاحيات</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--fg:#222;--card:#fff;--ac:#2e7d5b;--lt:#eeeed2;--dk:#769656;--hl:#f6f66999;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--fg:#eee;--card:#2a2926}}
:root[data-theme="dark"]{--bg:#1c1b19;--fg:#eee;--card:#2a2926}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:12px;max-width:520px;overflow-x:hidden}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card small{opacity:.7;display:block}
.sub{margin-right:14px;border-right:3px solid var(--ac)}
button,select{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff}
select{background:var(--card);color:var(--fg);border:1px solid #8885;flex:1}
button.g{background:transparent;color:var(--fg);border:1px solid #8885}
.big{width:100%;padding:13px;font-size:16px;margin:6px 0}
#bw{--b:min(calc(100vw - 24px),480px);width:var(--b);height:var(--b);position:relative;margin:8px auto;direction:ltr;border-radius:6px;overflow:hidden}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;height:100%}
.sq{display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:calc(var(--b)/8*.8);line-height:1;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",serif}
.l{background:var(--lt)}.d{background:var(--dk)}
.sq.h{box-shadow:inset 0 0 0 100px var(--hl)}.sq.s{box-shadow:inset 0 0 0 100px #4aa3ff88}
.pw{color:#fff;-webkit-text-stroke:1px #000;text-shadow:0 0 2px #000}.pk{color:#111;text-shadow:0 0 1px #fff6}
#ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#msg{min-height:64px;text-align:center;font-size:15px;line-height:1.6;margin:6px 0}
.bad{color:var(--bad)}.ok{color:var(--ac)}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.js"></script>
<script>
const L=[
{o:'الإيطالية',s:'w',n:'Giuoco Pianissimo',m:'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O',e:{0:'نسيطر على المركز ونفتح الفيل والوزير',2:'نهاجم بيدق e5 ونطوّر الحصان',4:'الفيل يضغط على نقطة الضعف f7',6:'نجهّز d4 لإقامة مركز كبير',8:'خطة هادئة: نحمي e4 ونبني ببطء',10:'تبييت الملك بأمان'}},
{o:'الإيطالية',s:'w',n:'Two Knights – Ng5',m:'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5 Bb5+ c6 dxc6 bxc6 Be2 h6 Nf3 e4 Ne5 Bd6',e:{6:'نهاجم f7 بحصانين، تهديد مباشر',7:'الرد الصحيح: ضرب المركز',9:'الأسود يضحّي ببيدق مقابل التطوير',14:'نرجع الفيل ونحتفظ ببيدق زيادة',18:'الحصان يحتل e5 كموقع متقدم'}},
{o:'روي لوبيز',s:'w',n:'الخط المغلق',m:'e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3',e:{4:'الفيل يضغط على الحصان المدافع عن e5',6:'نحافظ على الفيل ولا نبدّله',8:'نبيّت الملك قبل أي خطر على e4',10:'الرخ يحمي e4',14:'نجهّز d4 ونعطي الفيل مربع c2',16:'h3 تمنع Bg4 وتثبّت الوضع'}},
{o:'روي لوبيز',s:'w',n:'Berlin',m:'e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 Nd6 Bxc6 dxc6 dxe5 Nf5 Qxd8+ Kxd8',e:{8:'نفتح المركز بدل ما ندافع عن e5',10:'نخرّب بنية الأسود (بيادق c مزدوجة)',12:'ننتقل لنهاية لعبة بنيتها أفضل للأبيض',14:'تبديل الوزراء، وده "جدار برلين"'}},
{o:'جامبيت الملكة',s:'w',n:'المرفوض',m:'d4 d5 c4 e6 Nc3 Nf6 Bg5 Be7 e3 O-O Nf3 h6 Bh4 b6',e:{2:'نعرض بيدق مؤقتًا لنكسب المركز',3:'الأسود يدعم d5 بأمان',6:'نثبّت الحصان f6',8:'نحمي d4 ونفتح الفيل f1',13:'الأسود يستعد للفيل على b7'}},
{o:'جامبيت الملكة',s:'w',n:'المقبول',m:'d4 d5 c4 dxc4 Nf3 Nf6 e3 e6 Bxc4 c5 O-O a6',e:{2:'نعرض بيدق مؤقتًا',6:'نجهّز استرجاع البيدق',8:'استرجعنا البيدق مع تطوير',9:'الأسود يضرب المركز'}},
{o:'لندن',s:'w',n:'النظام الأساسي',m:'d4 d5 Bf4 Nf6 e3 c5 c3 Nc6 Nd2 e6 Ngf3 Bd6 Bg3 O-O',e:{2:'نُخرج الفيل خارج السلسلة قبل e3',4:'نغلق السلسلة ونحمي الفيل',6:'نقوّي d4',12:'نبدّل الفيل إن لزم'}},
{o:'سيسيليان',s:'b',n:'Najdorf – Be3 (English Attack)',m:'e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5 Nb3 Be6 f3 Be7',e:{1:'الأسود يهاجم d4 من الجناح',5:'نتخلى عن بيدق c لنفتح خط c',9:'a6 تمنع Nb5 وتجهّز b5',11:'نحتل d5 ونضرب المركز',13:'نطوّر الفيل ونضغط على c4'}},
{o:'الفرنسية',s:'b',n:'Classical',m:'e4 e6 d4 d5 Nc3 Nf6 Bg5 Be7 e5 Nfd7 Bxe7 Qxe7 f4 O-O Nf3 c5',e:{1:'نبني سلسلة بيادق صلبة',5:'نهاجم e4',9:'الحصان يتراجع ليدعم الضرب بـ c5',15:'ضرب قاعدة سلسلة البيادق d4'}},
{o:'الفرنسية',s:'b',n:'Advance',m:'e4 e6 d4 d5 e5 c5 c3 Nc6 Nf3 Qb6 a3 c4 Nbd2 Na5',e:{5:'نضرب قاعدة d4 مباشرة',9:'ضغط على d4 وb2',11:'نغلق الجناح ونمنع b3',13:'الحصان يضغط على b3'}},
{o:'كارو-كان',s:'b',n:'Classical',m:'e4 c6 d4 d5 Nc3 dxe4 Nxe4 Bf5 Ng3 Bg6 h4 h6 Nf3 Nd7 h5 Bh7 Bd3 Bxd3 Qxd3 e6',e:{1:'ندعم d5 من غير ما نسد الفيل',7:'الفيل خارج السلسلة قبل e6',10:'تهديد بتقدّم h5',14:'نصطاد الفيل',17:'تبديل الفيل المحاصَر',19:'الأسود محكم الوضع'}},
{o:'جامبيت الملك',s:'w',n:'Kieseritzky',m:'e4 e5 f4 exf4 Nf3 g5 h4 g4 Ne5 Nf6 Bc4 d5 exd5 Bd6',e:{2:'نضحّي ببيدق لنفتح خط f ونسيطر على المركز',4:'نمنع Qh4+ ونطوّر',6:'نهاجم بيدق g لنفكّه',8:'الحصان في المركز قوي',10:'الفيل يهدد f7'}},
{o:'جامبيت الملك',s:'w',n:'المرفوض',m:'e4 e5 f4 Bc5 Nf3 d6 c3 Nf6 d3 O-O',e:{3:'رفض الجامبيت وضغط على g1',6:'نجهّز d4',8:'نحمي e4 ببنية صلبة'}},
{o:'الجامبيت الإيطالي',s:'w',n:'Italian Gambit',m:'e4 e5 Nf3 Nc6 Bc4 Nf6 d4 exd4 O-O Nxe4 Re1 d5 Bxd5 Qxd5 Nc3 Qa5 Nxe4 Be6',e:{6:'جامبيت: نفتح المركز لتطوير سريع',8:'نتخلى عن بيدق لنفتح خط e',10:'نهاجم الحصان على e4',12:'نضحّي بالفيل لنكسب الوقت',14:'نهاجم الوزير ونسترد المادة'}},
{o:'جامبيت فيليدور',s:'b',n:'Philidor Countergambit',m:'e4 e5 Nf3 d6 d4 f5 Nc3 fxe4 Nxe4 d5 Ng3 e4 Ne5 Nf6',e:{3:'دفاع فيليدور: ندعم e5 بالبيدق',5:'جامبيت مضاد: نضرب مركز الأبيض',7:'نبدّل البيادق لنفتح خط f',9:'نطرد الحصان بتقدّم المركز',11:'بيدق e يطرد الحصان f3'}},
{o:'الإيطالية',s:'w',n:'Evans Gambit',m:'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O'},
{o:'الإيطالية',s:'w',n:'Fried Liver',m:'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5 Nxf7 Kxf7 Qf3+ Ke6 Nc3 Ncb4 Qe4 c6 a3 Na6 d4'},
{o:'الإيطالية',s:'w',n:'Giuoco Piano – d4',m:'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Bd2 Bxd2+ Nbxd2 d5 exd5 Nxd5 Qb3 Nce7 O-O O-O'},
{o:'روي لوبيز',s:'w',n:'Open',m:'e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Nxe4 d4 b5 Bb3 d5 dxe5 Be6 c3 Be7'},
{o:'روي لوبيز',s:'w',n:'Exchange',m:'e4 e5 Nf3 Nc6 Bb5 a6 Bxc6 dxc6 O-O f6 d4 exd4 Nxd4 c5 Nb3 Qxd1 Rxd1 Bg4'},
{o:'جامبيت الملكة',s:'w',n:'Exchange',m:'d4 d5 c4 e6 Nc3 Nf6 cxd5 exd5 Bg5 Be7 e3 O-O Bd3 Nbd7'},
{o:'جامبيت الملكة',s:'w',n:'Slav',m:'d4 d5 c4 c6 Nf3 Nf6 Nc3 dxc4 a4 Bf5 e3 e6 Bxc4 Bb4'},
{o:'لندن',s:'w',n:'ضد King\'s Indian',m:'d4 Nf6 Bf4 g6 e3 Bg7 Nf3 O-O h3 d6 Be2 Nbd7'},
{o:'لندن',s:'w',n:'ضد c5 (Qb3)',m:'d4 d5 Bf4 c5 e3 Nc6 c3 Qb6 Qb3 c4 Qxb6 axb6'},
{o:'سيسيليان',s:'b',n:'Najdorf – Bg5',m:'e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6 f4 Be7 Qf3 Qc7 O-O-O Nbd7'},
{o:'سيسيليان',s:'b',n:'Dragon',m:'e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 Be3 Bg7 f3 O-O Qd2 Nc6'},
{o:'سيسيليان',s:'b',n:'Sveshnikov',m:'e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 Nf6 Nc3 e5 Ndb5 d6 Bg5 a6 Na3 b5 Bxf6 gxf6 Nd5 f5'},
{o:'الفرنسية',s:'b',n:'Winawer',m:'e4 e6 d4 d5 Nc3 Bb4 e5 c5 a3 Bxc3+ bxc3 Ne7 Qg4 Qc7 Qxg7 Rg8 Qxh7 cxd4'},
{o:'الفرنسية',s:'b',n:'Tarrasch',m:'e4 e6 d4 d5 Nd2 Nf6 e5 Nfd7 Bd3 c5 c3 Nc6 Ne2 cxd4 cxd4 f6'},
{o:'كارو-كان',s:'b',n:'Advance',m:'e4 c6 d4 d5 e5 Bf5 Nf3 e6 Be2 c5 Be3 Nd7'},
{o:'كارو-كان',s:'b',n:'Panov',m:'e4 c6 d4 d5 exd5 cxd5 c4 Nf6 Nc3 e6 Nf3 Be7 cxd5 Nxd5'},
{o:'جامبيت فيليدور',s:'b',n:'Philidor الكلاسيكي',m:'e4 e5 Nf3 d6 d4 exd4 Nxd4 Nf6 Nc3 Be7 Be2 O-O O-O c5'},
{o:'ألين جامبيت 👽',s:'w',n:'الخط الرئيسي (…Bg4)',m:'e4 c6 d4 d5 Nd2 dxe4 Nxe4 Nf6 Ng5 h6 Nxf7 Kxf7 Nf3 Bg4 Ne5+ Ke8 Nxg4 Nxg4 Qxg4',e:{8:'نهاجم f7 (غير سليمة عند المحركات لكنها مفاجئة)',10:'تضحية بالحصان لسحب الملك للعراء',12:'نطوّر بسرعة وبتهديد',14:'شوكة على الملك والفيل',18:'استرجعنا القطعة مع بيدق وهجوم'}},
{o:'ألين جامبيت 👽',s:'w',n:'…Bf5',m:'e4 c6 d4 d5 Nd2 dxe4 Nxe4 Nf6 Ng5 h6 Nxf7 Kxf7 Nf3 Bf5 Bc4+ e6 Qe2',e:{14:'الفيل يطارد الملك على قطر c4-f7',16:'الوزير يجهّز الهجوم ويحرس الفيل'}}
];
L.forEach(x=>x.e=x.e||{});
const P={k:'♚\uFE0E',q:'♛\uFE0E',r:'♜\uFE0E',b:'♝\uFE0E',n:'♞\uFE0E',p:'♟\uFE0E'};
const day=()=>Math.floor(Date.now()/864e5);
let S={};try{S=JSON.parse(localStorage.getItem('oc1'))||{}}catch(e){}
const save=()=>{try{localStorage.setItem('oc1',JSON.stringify(S))}catch(e){}};
const st=i=>S[i]||{l:0,ef:2.5,r:0,iv:0,due:0};
const A=document.getElementById('app');
const BN=['بوت عشوائي','بوت مبتدئ','بوت متوسط','بوت قوي'];
const OPN=[...new Set(L.map(x=>x.o))];let OP={};
let g,mv,idx,mode,li,mis,sel,hint,queue,busy,M='',ME,W,T,lvl;

/* محرك بسيط: negamax + alpha-beta */
const V={p:100,n:320,b:330,r:500,q:900,k:0};
function ev(c){let s=0;const b=c.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(!p)continue;let v=V[p.type];const cn=7-Math.abs(3.5-f)-Math.abs(3.5-r);if('nbp'.includes(p.type))v+=cn*(p.type==='p'?3:6);s+=p.color==='w'?v:-v}return s}
function srch(c,d,a,b){
  if(c.in_checkmate())return-99999-d;if(c.in_draw())return 0;
  if(!d)return(c.turn()==='w'?1:-1)*ev(c);
  const ms=c.moves({verbose:true}).sort((x,y)=>(y.captured?V[y.captured]*10-V[y.piece]:0)-(x.captured?V[x.captured]*10-V[x.piece]:0));
  for(const m of ms){c.move(m);const s=-srch(c,d-1,-b,-a);c.undo();if(s>=b)return b;if(s>a)a=s}
  return a}
function pick(c,l){
  const ms=c.moves({verbose:true});if(l===0)return ms[Math.random()*ms.length|0];
  const d=l,sc=[];let a=-1e6,best=ms[0];
  for(const m of ms){c.move(m);const s=-srch(c,d-1,-1e6,l===1?1e6:-a);c.undo();sc.push([s,m]);if(s>a){a=s;best=m}}
  if(l===1){sc.sort((x,y)=>y[0]-x[0]);return sc[Math.random()*Math.min(4,sc.length)|0][1]}
  return best}

function status(i){const s=st(i);if(!s.l)return'جديد';return s.due<=day()?'مستحق للمراجعة':'محفوظ · بعد '+(s.due-day())+' يوم'}
function tg(k){OP[k]=!OP[k];home()}
function home(){
  const due=L.map((_,i)=>i).filter(i=>st(i).l&&st(i).due<=day());
  let h='<h1>♞ مدرب الافتتاحيات</h1>';
  h+=`<div class="card" style="flex-direction:column;align-items:stretch"><b>♟ العب ضد بوت</b><div class="bar"><select id="pl">${BN.map((x,i)=>`<option value="${i}"${i==2?' selected':''}>${x}</option>`).join('')}</select><select id="pc"><option value="w">أبيض</option><option value="b">أسود</option><option value="r">عشوائي</option></select></div><button onclick="play()">ابدأ اللعب</button></div>`;
  h+=due.length?`<button class="big" onclick="train([${due}])">تدريب الآن (${due.length} مستحق)</button>`:'<div class="card">مفيش مراجعات مستحقة دلوقتي 👌</div>';
  OPN.forEach((o,k)=>{const ids=L.map((_,i)=>i).filter(i=>L[i].o===o);
    h+=`<div class="card" onclick="tg(${k})"><div><b>${o}</b><small>${ids.length} تفريعة</small></div><span>${OP[k]?'▴':'▾'}</span></div>`;
    if(OP[k])ids.forEach(i=>h+=`<div class="card sub"><div>${L[i].n}<small>${L[i].s=='w'?'بالأبيض':'بالأسود'} · ${status(i)}</small></div><div><button class="g" onclick="learn(${i})">تعلّم</button> <button onclick="train([${i}])">تدرّب</button></div></div>`)});
  A.innerHTML=h;
}
function start(i,m){li=i;mode=m;ME=L[i].s;W=ME==='w';T=L[i].o+' · '+L[i].n;mv=L[i].m.split(' ');idx=0;mis=0;sel=null;hint=null;busy=false;M='';g=new Chess();draw();setTimeout(auto,400)}
function learn(i){start(i,'learn')}
function train(q){queue=q.slice();start(queue.shift(),'train')}
function msg(t,c){M=`<span class="${c}">${t}</span>`;const e=document.getElementById('msg');if(e)e.innerHTML=M}
function auto(){
  let on='';
  if(idx>=mv.length)return finish();
  if(g.turn()!==ME){const p=idx;g.move(mv[idx++],{sloppy:true});
    if(mode==='learn'&&L[li].e[p])on=`الخصم لعب <b>${mv[p]}</b> — ${L[li].e[p]}<br>`;
    if(idx>=mv.length){draw();return setTimeout(finish,900)}}
  hint=null;
  if(mode==='learn'){const m=g.moves({verbose:true}).find(m=>m.san===mv[idx]);if(m)hint=[m.from,m.to];
    msg(on+`العب <b>${mv[idx]}</b>`+(L[li].e[idx]?` — ${L[li].e[idx]}`:''),'')}
  else M='';
  draw();
}
/* اللعب ضد البوت */
function play(){lvl=+document.getElementById('pl').value;const c=document.getElementById('pc').value;
  ME=c==='r'?(Math.random()<.5?'w':'b'):c;W=ME==='w';mode='play';T=BN[lvl];g=new Chess();sel=null;hint=null;busy=false;M='';draw();if(ME==='b')bot()}
function bot(){busy=true;msg('البوت بيفكّر…','');setTimeout(()=>{g.move(pick(g,lvl));busy=false;hint=null;post()},80)}
function post(){
  if(g.game_over()){M=g.in_checkmate()?(g.turn()===ME?'<span class="bad">كش مات، خسرت</span>':'<span class="ok">كش مات! كسبت 🎉</span>'):'تعادل';return draw()}
  setTimeout(()=>{const s=(g.turn()==='w'?1:-1)*srch(g,2,-1e6,1e6)*(ME==='w'?1:-1);M=`تقييم المحرك: ${s>0?'+':''}${(s/100).toFixed(1)} ${s>=0?'لصالحك':'لصالح البوت'}`;draw()},30)}
function tip(){if(busy||g.turn()!==ME||g.game_over())return;msg('بحسب أفضل نقلة…','');setTimeout(()=>{const m=pick(g,3);hint=[m.from,m.to];msg(`نصيحة: <b>${m.san}</b>`,'ok');draw()},60)}
function undo(){if(busy||g.history().length<1)return;g.undo();if(g.turn()!==ME&&g.history().length)g.undo();hint=null;M='';draw()}
function arrow(f,t,w){
  const c=s=>{const F='abcdefgh'.indexOf(s[0]),R=8-+s[1];return[((w?F:7-F)+.5)*12.5,((w?R:7-R)+.5)*12.5]};
  const[a,b]=c(f),[x,y]=c(t),d=Math.hypot(x-a,y-b),k=3.2/d;
  return `<svg id="ar" viewBox="0 0 100 100"><defs><marker id="ah" markerWidth="4" markerHeight="4" refX="2.2" refY="2" orient="auto"><path d="M0,0L4,2L0,4z" fill="#e8892b"/></marker></defs><line x1="${a}" y1="${b}" x2="${x-(x-a)*k}" y2="${y-(y-b)*k}" stroke="#e8892b" stroke-width="2.4" stroke-linecap="round" opacity=".85" marker-end="url(#ah)"/></svg>`;
}
function draw(){
  const b=g.board();let h=`<div class="bar"><button class="g" onclick="home()">← رجوع</button><b>${T}</b></div><div id="bw"><div id="board">`;
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const R=W?r:7-r,F=W?f:7-f,p=b[R][F],sq='abcdefgh'[F]+(8-R);
    h+=`<div class="sq ${(R+F)%2?'d':'l'}${hint&&hint.includes(sq)?' h':''}${sel===sq?' s':''}" onclick="tap('${sq}')">${p?`<span class="${p.color==='w'?'pw':'pk'}">${P[p.type]}</span>`:''}</div>`}
  h+=`</div>${hint?arrow(hint[0],hint[1],W):''}</div><div id="msg">${M}</div>`;
  h+=mode==='play'?`<div class="bar"><button class="g" onclick="undo()">↩ تراجع</button><button onclick="tip()">💡 نصيحة</button><button class="g" onclick="play()">لعبة جديدة</button></div>`
   :`<div class="bar"><small>${mode==='learn'?'وضع التعلّم: اتبع السهم':'وضع التدريب: من غير تلميحات'}</small><small>نقلة ${Math.ceil(idx/2)}/${Math.ceil(mv.length/2)}</small></div>`;
  A.innerHTML=h;
}
function tap(sq){
  if(busy||g.turn()!==ME)return;
  if(mode==='play'&&g.game_over())return;
  if(mode!=='play'&&idx>=mv.length)return;
  const p=g.get(sq);
  if(!sel||(p&&p.color===ME&&sq!==sel)){sel=(p&&p.color===ME)?sq:null;return draw()}
  const m=g.moves({verbose:true}).find(m=>m.from===sel&&m.to===sq&&(!m.promotion||m.promotion==='q'));sel=null;
  if(!m)return draw();
  if(mode==='play'){g.move(m);hint=null;M='';draw();if(g.game_over())return post();return bot()}
  if(m.san===mv[idx]){g.move(m);idx++;hint=null;msg('✔ صح','ok');draw();setTimeout(auto,500)}
  else{mis++;const c=g.moves({verbose:true}).find(x=>x.san===mv[idx]);if(c)hint=[c.from,c.to];
    msg(`✘ غلط. الصح: <b>${mv[idx]}</b>`+(L[li].e[idx]?` — ${L[li].e[idx]}`:''),'bad');draw();
    if(mode==='train'){busy=true;setTimeout(()=>{g.move(mv[idx++],{sloppy:true});busy=false;hint=null;draw();setTimeout(auto,600)},1800)}}
}
function finish(){
  const s=st(li);s.l=1;
  if(mode==='train'){const q=mis===0?5:mis===1?3:1;
    if(q<3){s.r=0;s.iv=1}else{s.r++;s.iv=s.r===1?1:s.r===2?3:Math.round(s.iv*s.ef)}
    s.ef=Math.max(1.3,s.ef+.1-(5-q)*(.08+(5-q)*.02));s.due=day()+s.iv}
  else{s.due=Math.min(s.due||day(),day())}
  S[li]=s;save();
  const nx=queue&&queue.length&&mode==='train';
  A.innerHTML=`<h1>${mis===0?'🎉 ممتاز!':'خلصت الخط'}</h1><div class="card">${T}<small>${mode==='train'?`أخطاء: ${mis} · المراجعة الجاية بعد ${s.iv} يوم`:'اتحفظ في قايمة المراجعة'}</small></div>`+
   (mode==='learn'?`<button class="big" onclick="train([${li}])">جرّبه تدريب</button>`:'')+
   (nx?`<button class="big" onclick="train([${queue}])">الخط التالي</button>`:'')+`<button class="big g" onclick="home()">القايمة الرئيسية</button>`;
}
home();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
