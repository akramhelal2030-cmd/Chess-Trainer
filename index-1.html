:root[data-theme="dark"]{--bg:#1c1b19;--fg:#eee;--card:#2a2926}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:12px;max-width:520px;overflow-x:hidden}

.card small{opacity:.7;display:block}
.sub{margin-right:14px;border-right:3px solid var(--ac)}
button,select{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff}
select{background:var(--card);color:var(--fg);border:1px solid #8885;flex:1}
button.g{background:transparent;color:var(--fg);border:1px solid #8885}
.big{width:100%;padding:13px;font-size:16px;margin:6px 0}
#bw{--b:min(calc(100vw - 24px),480px);width:var(--b);height:var(--b);position:relative;margin:8px auto;direction:ltr;border-radius:6px;overflow:hidden}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;height:100%}
.sq{position:relative;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-tap-highlight-color:transparent}
#board{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none}.pc,.sq{-webkit-user-drag:none}
.l{background-color:#eeeed2}.d{background-color:#769656}
.l.lm,.l.s{background-color:#f6f669}.d.lm,.d.s{background-color:#baca2b}
.sq.h{box-shadow:inset 0 0 0 100px var(--hl)}
.ck{background-image:radial-gradient(circle,rgba(255,0,0,.9) 0,rgba(231,0,0,.55) 40%,transparent 72%)}
.pc{position:relative;z-index:2;width:92%;height:92%;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.dt{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.2);pointer-events:none}
.rg{position:absolute;inset:3%;border-radius:50%;border:5px solid rgba(0,0,0,.2);pointer-events:none}
.rk,.fl{position:absolute;font:700 clamp(9px,2.8vw,13px) system-ui;font-style:normal;pointer-events:none;z-index:1}
.rk{top:2px;left:3px}.fl{bottom:1px;right:3px}
.l .rk,.l .fl{color:#769656}.d .rk,.d .fl{color:#eeeed2}
#ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#msg{min-height:64px;text-align:center;font-size:15px;line-height:1.6;margin:6px 0}
.bad{color:var(--bad)}.ok{color:var(--ac)}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center}
.pb button{padding:8px 9px;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.chip{padding:3px 7px;border-radius:8px;background:var(--card);font-size:13px;border:1px solid transparent;font-weight:600}.chip.cur{border-color:#4aa3ff}
</style>

const V={p:100,n:320,b:330,r:500,q:900,k:0};
function ev(c){let s=0;const b=c.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(!p)continue;let v=V[p.type];const cn=7-Math.abs(3.5-f)-Math.abs(3.5-r);if('nbp'.includes(p.type))v+=cn*(p.type==='p'?3:6);s+=p.color==='w'?v:-v}return s}
function srch(c,d,a,b){
  if(c.in_checkmate())return-99999-d;if(c.in_draw())return 0;
  if(!d)return(c.turn()==='w'?1:-1)*ev(c);
  const ms=c.moves({verbose:true}).sort((x,y)=>(y.captured?V[y.captured]*10-V[y.piece]:0)-(x.captured?V[x.captured]*10-V[x.piece]:0));
  for(const m of ms){c.move(m);const s=-srch(c,d-1,-b,-a);c.undo();if(s>=b)return b;if(s>a)a=s}
  return a}

  SFW.onmessage=e=>{const l=String(e.data);if(l==='uciok')SFW.postMessage('isready');else if(l==='readyok'){clearTimeout(to);SFW.onmessage=null;SFW.postMessage('ucinewgame');res()}};
  SFW.postMessage('uci')})}
function sfEval(fen,depth){return new Promise(res=>{let last=null;
  SFW.onmessage=e=>{const l=String(e.data);
    if(l.startsWith('info')&&l.includes(' score ')&&!/bound/.test(l)){const m=l.match(/score (cp|mate) (-?\d+)/),p=l.match(/ pv (\S+)/);if(m)last={t:m[1],v:+m[2],pv:p?p[1]:null}}
    else if(l.startsWith('bestmove')){const bm=l.split(' ')[1];let cp=0;if(last)cp=last.t==='mate'?(last.v>0?1:-1)*(10000-Math.abs(last.v)*10):last.v;res({cp,bm:bm&&bm!=='(none)'?bm:null})}};
  SFW.postMessage('position fen '+fen);SFW.postMessage('go depth '+depth)})}
const wpW=x=>50+50*(2/(1+Math.exp(-.00368208*Math.max(-1000,Math.min(1000,x))))-1);
const CL={best:['★','أفضل نقلة','#7cb342'],br:['!!','رائعة (Brilliant)','#26c6da'],exc:['👍','ممتازة','#9ccc65'],good:['✓','جيدة','#9aa'],book:['📖','نظرية','#a1887f'],inac:['?!','دقة ناقصة','#fbc02d'],mist:['?','خطأ','#fb8c00'],blun:['??','غلطة فادحة','#e53935']};
function isSac(fen,san){try{const c=new Chess(fen),m=c.move(san,{sloppy:true});if(!m)return false;const V2={p:1,n:3,b:3,r:5,q:9,k:0},mv=V2[m.piece];if(mv<3)return false;const cap=m.captured?V2[m.captured]:0;
  for(const a of c.moves({verbose:true}).filter(x=>x.to===m.to&&x.captured)){c.move(a);const d=c.moves({verbose:true}).some(y=>y.to===m.to&&y.captured);c.undo();if(mv-(d?V2[a.piece]:0)-cap>=2)return true}}catch(e){}return false}
async function review(){
  if(busy)return;const hist=g.history({verbose:true});if(hist.length<2){msg('اللعبة قصيرة، العب كذا نقلة الأول','bad');return}
  R={m:hist.map(x=>x.san),uci:hist.map(x=>x.from+x.to+(x.promotion||'')),done:false,cp:[],best:[],sb:false};
  const c=new Chess();R.fens=[c.fen()];hist.forEach(x=>{c.move(x.san,{sloppy:true});R.fens.push(c.fen())});
  mode='review';ME='x';sel=null;hint=null;busy=true;T='مراجعة اللعبة';R.i=R.m.length;ply(R.i);msg('بحمّل المحرك…','');
  try{if(!SFW)await sfInit()}catch(e){busy=false;SFW=null;msg('مش لاقي ملفات Stockfish. تأكد إنك رفعت stockfish-18-lite-single.js و.wasm جنب index.html على GitHub','bad');return}
  for(let k=0;k<R.fens.length;k++){
    if(mode!=='review')return;
    const cc=new Chess(R.fens[k]);
    if(cc.in_checkmate()){R.cp.push(cc.turn()==='w'?-10000:10000);R.best.push(null)}
    else if(cc.game_over()){R.cp.push(0);R.best.push(null)}
    else{const r=await sfEval(R.fens[k],12),s=R.fens[k].split(' ')[1];R.cp.push(s==='w'?r.cp:-r.cp);R.best.push(r.bm)}
    msg(`جاري التحليل ${k+1}/${R.fens.length}…`,'')}
  classify();R.done=true;busy=false;ply(R.m.length)}
function classify(){
  const n=R.m.length;R.cls=[];R.loss=[];R.bsan=[];R.wp=R.cp.map(wpW);
  for(let k=0;k<n;k++){
    const side=R.fens[k].split(' ')[1],mw=a=>side==='w'?wpW(a):100-wpW(a),bf=mw(R.cp[k]),af=mw(R.cp[k+1]),loss=Math.max(0,bf-af);
    const pre=R.m.slice(0,k+1).join(' '),book=L.some(x=>x.ok&&(x.m===pre||x.m.startsWith(pre+' ')));
    let c;
    if(book)c='book';
    else if(loss<=2&&bf<=85&&af>=45&&isSac(R.fens[k],R.m[k]))c='br';
    else if(R.best[k]&&R.uci[k]===R.best[k])c='best';
    else c=loss<=2?'exc':loss<=5?'good':loss<=10?'inac':loss<=20?'mist':'blun';
    R.cls.push(c);R.loss.push(book?0:loss);
    let bs='';if(R.best[k]){try{const b=R.best[k],m=new Chess(R.fens[k]).move({from:b.slice(0,2),to:b.slice(2,4),promotion:b[4]});bs=m?m.san:''}catch(e){}}
    R.bsan.push(bs)}}
function ply(i,sb){
  R.i=Math.max(0,Math.min(R.m.length,i));R.sb=!!sb;
  const k=R.i-1,bad=R.done&&k>=0&&['inac','mist','blun'].includes(R.cls[k]),pre=R.sb&&bad;
  g=new Chess();let last=null;for(let j=0;j<(pre?k:R.i);j++)last=g.move(R.m[j],{sloppy:true});
  lm=(!pre&&last)?[last.from,last.to]:null;hint=null;
  if(pre&&R.best[k])hint=[R.best[k].slice(0,2),R.best[k].slice(2,4)];
  draw();
  if(R.done&&k>=0){const c=CL[R.cls[k]];msg(`<b>${R.m[k]}</b> <span style="color:${c[2]}">${c[0]} ${c[1]}</span>`+(bad&&R.bsan[k]?`<br>الأفضل: <b>${R.bsan[k]}</b>`:''),'')}}
const evs=cp=>Math.abs(cp)>=9000?(cp>0?'+':'-')+'M':(cp>0?'+':'')+(cp/100).toFixed(1);
function revPanel(){
  if(!R.done)return'';
  const i=R.i,n=R.m.length,k=i-1,bad=k>=0&&['inac','mist','blun'].includes(R.cls[k]);
  const acc=s=>{const a=R.loss.filter((_,j)=>j%2===s).map(l=>Math.max(0,Math.min(100,103.1668*Math.exp(-.04354*l)-3.1669)));return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0};
  const cnt=(s,c)=>R.cls.filter((x,j)=>j%2===s&&x===c).length;
  const pts=R.wp.map((v,j)=>`${(j/n*300).toFixed(1)},${(60-v*.6).toFixed(1)}`).join(' ');
  let h=`<div class="card" style="flex-direction:column;align-items:stretch"><div class="bar"><span>⚪ ${acc(0)}% <small>(؟؟ ${cnt(0,'blun')} · ؟ ${cnt(0,'mist')})</small></span><span>⚫ ${acc(1)}% <small>(؟؟ ${cnt(1,'blun')} · ؟ ${cnt(1,'mist')})</small></span></div>`
   +`<div style="height:10px;border-radius:5px;background:#333;overflow:hidden;direction:ltr"><div style="width:${R.wp[i]}%;height:100%;background:#fff"></div></div><small style="text-align:center">التقييم: ${evs(R.cp[i])} (للأبيض)</small></div>`
   +`<div class="bar pb" style="direction:ltr"><button class="g" onclick="ply(0)">⏮</button><button class="g" onclick="ply(R.i-1)">◀</button><button class="g" onclick="ply(R.i+1)">▶</button><button class="g" onclick="ply(R.m.length)">⏭</button>${bad?`<button onclick="ply(R.i,${!R.sb})">💡 الأفضل</button>`:''}</div>`
   +`<svg viewBox="0 0 300 60" onclick="gx(event)" style="width:100%;height:80px;background:#8883;border-radius:8px;margin:8px 0;direction:ltr"><line x1="0" y1="30" x2="300" y2="30" stroke="#8886"/><polyline points="${pts}" fill="none" stroke="#e8892b" stroke-width="2"/><line x1="${i/n*300}" y1="0" x2="${i/n*300}" y2="60" stroke="#4aa3ff" stroke-width="1.5"/></svg>`
   +`<div class="chips" style="direction:ltr">`+R.m.map((s,j)=>`<span class="chip${j===k?' cur':''}" style="color:${CL[R.cls[j]][2]}" onclick="ply(${j+1})">${j%2?'':(j/2+1)+'. '}${s} ${CL[R.cls[j]][0]}</span>`).join('')+`</div>`;
  return h}
function gx(e){const r=e.currentTarget.getBoundingClientRect();ply(Math.round((e.clientX-r.left)/r.width*R.m.length))}
function finish(){
  const s=st(li);s.l=1;
  if(mode==='train'){const q=mis===0?5:mis===1?3:1;
    if(q<3){s.r=0;s.iv=1}else{s.r++;s.iv=s.r===1?1:s.r===2?3:Math.round(s.iv*s.ef)}
    s.ef=Math.max(1.3,s.ef+.1-(5-q)*(.08+(5-q)*.02));s.due=day()+s.iv}
  else{s.due=Math.min(s.due||day(),day())}
  S[li]=s;save();SO.win();
  const nx=queue&&queue.length&&mode==='train';
  A.innerHTML=`<h1>${mis===0?'🎉 ممتاز!':'خلصت الخط'}</h1><div class="card">${T}<small>${mode==='train'?`أخطاء: ${mis} · المراجعة الجاية بعد ${s.iv} يوم`:'اتحفظ في قايمة المراجعة'}</small></div>`+
   (mode==='learn'?`<button class="big" onclick="train([${li}])">جرّبه تدريب</button>`:'')+
   (nx?`<button class="big" onclick="train([${queue}])">الخط التالي</button>`:'')+`<button class="big g" onclick="home()">القايمة الرئيسية</button>`}
home();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
